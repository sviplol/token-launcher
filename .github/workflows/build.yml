name: Build Token Launcher
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install PySide6 requests winotify pyinstaller -i https://pypi.tuna.tsinghua.edu.cn/simple
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Build Windows
        shell: bash
        run: |
          pyinstaller --onefile --windowed --name "Token接入器" --icon assets/icons/app.ico --add-data "src;src" --add-data "assets;assets" --hidden-import winotify --hidden-import winotify.audio --collect-submodules src.ui --collect-submodules src.modules --collect-submodules src.utils --collect-submodules src.i18n --collect-submodules src.models src/_entry.py
          cp "dist/Token接入器.exe" "dist/Token接入器_v${{ steps.ver.outputs.version }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-Token接入器_v${{ steps.ver.outputs.version }}
          path: dist/Token接入器_v${{ steps.ver.outputs.version }}.exe

  build-mac-m:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install PySide6 requests pyinstaller -i https://pypi.tuna.tsinghua.edu.cn/simple
      - name: Read version
        id: ver
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Build .app (arm64)
        run: |
          pyinstaller --windowed --noconfirm --name "Token接入器" --add-data "src:src" --add-data "assets:assets" --collect-submodules src.ui --collect-submodules src.modules --collect-submodules src.utils --collect-submodules src.i18n --collect-submodules src.models --target-arch arm64 src/_entry.py
      - name: Ad-hoc sign
        run: codesign --force --deep --sign - "dist/Token接入器.app"
      - name: Create DMG
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          hdiutil create -volname "Token接入器" -srcfolder "dist/Token接入器.app" -ov -format UDZO "Token接入器_M_v${VERSION}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Mac-M芯片-Token接入器_v${{ steps.ver.outputs.version }}
          path: Token接入器_M_v${{ steps.ver.outputs.version }}.dmg

  build-mac-intel:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      # ===== 方案：在M芯片runner上用Rosetta 2跑x86_64 Python =====
      # 安装x86_64版Homebrew（/usr/local），用它装x86_64 Python
      - name: Install x86_64 Homebrew + Python (Rosetta 2)
        run: |
          # 安装x86_64 brew到/usr/local
          if [ ! -f /usr/local/bin/brew ]; then
            arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          # 用x86_64 brew装Python
          arch -x86_64 /usr/local/bin/brew install python@3.11
          # 验证架构
          /usr/local/opt/python@3.11/bin/python3.11 -c "import struct; print('Python arch:', 'x86_64' if struct.calcsize('P') == 8 else 'unknown')"

      - name: Install deps (x86_64)
        run: |
          /usr/local/opt/python@3.11/bin/python3.11 -m pip install PySide6 requests pyinstaller -i https://pypi.tuna.tsinghua.edu.cn/simple

      - name: Verify Python is x86_64
        run: |
          /usr/local/opt/python@3.11/bin/python3.11 -c "
          import struct, sys
          print(f'Python {sys.version}')
          print(f'pointer size: {struct.calcsize(\"P\")} bytes')
          import platform
          print(f'machine: {platform.machine()}')
          "

      - name: Build .app (x86_64 native)
        run: |
          /usr/local/opt/python@3.11/bin/python3.11 -m PyInstaller --windowed --noconfirm --name "Token接入器-Intel" --add-data "src:src" --add-data "assets:assets" --collect-submodules src.ui --collect-submodules src.modules --collect-submodules src.utils --collect-submodules src.i18n --collect-submodules src.models src/_entry.py

      - name: Verify binary is x86_64
        run: |
          BINARY="dist/Token接入器-Intel.app/Contents/MacOS/Token接入器-Intel"
          if [ -f "$BINARY" ]; then
            ARCH=$(file "$BINARY" | grep -o 'x86_64\|arm64')
            echo "Binary architecture: $ARCH"
            if [ "$ARCH" != "x86_64" ]; then
              echo "ERROR: Binary is NOT x86_64! Build failed."
              exit 1
            fi
          else
            echo "ERROR: Binary not found at $BINARY"
            find dist -name "*.app" -exec find {} -type f -name "Token*" \;
            exit 1
          fi

      - name: Ad-hoc sign
        run: codesign --force --deep --sign - "dist/Token接入器-Intel.app"

      - name: Create DMG
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          hdiutil create -volname "Token接入器-Intel" -srcfolder "dist/Token接入器-Intel.app" -ov -format UDZO "Token接入器_Intel_v${VERSION}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Mac-英特尔-Token接入器_v${{ steps.ver.outputs.version }}
          path: Token接入器_Intel_v${{ steps.ver.outputs.version }}.dmg
