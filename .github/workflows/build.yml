
name: Build Token Launcher
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install PySide6 requests winotify pyinstaller -i https://pypi.tuna.tsinghua.edu.cn/simple
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Build Windows
        shell: bash
        run: |
          pyinstaller --onefile --windowed --name "Token接入器" --icon assets/icons/app.ico --add-data "src;src" --add-data "assets;assets" --hidden-import winotify --hidden-import winotify.audio --collect-submodules src.ui --collect-submodules src.modules --collect-submodules src.utils --collect-submodules src.i18n --collect-submodules src.models src/_entry.py
          cp "dist/Token接入器.exe" "dist/Token接入器_v${{ steps.ver.outputs.version }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-Token接入器_v${{ steps.ver.outputs.version }}
          path: dist/Token接入器_v${{ steps.ver.outputs.version }}.exe

  build-mac-m:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install PySide6 requests pyinstaller -i https://pypi.tuna.tsinghua.edu.cn/simple
      - name: Read version
        id: ver
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Build .app (arm64)
        run: |
          pyinstaller --windowed --noconfirm --name "Token接入器" --add-data "src:src" --add-data "assets:assets" --collect-submodules src.ui --collect-submodules src.modules --collect-submodules src.utils --collect-submodules src.i18n --collect-submodules src.models --target-arch arm64 src/_entry.py
      - name: Smoke test (launch 8s)
        run: |
          open "dist/Token接入器.app"
          sleep 8
          if pgrep -f "Token接入器" > /dev/null; then
            echo "App is running"
            pkill -f "Token接入器" || true
          else
            echo "App failed to launch!"
            exit 1
          fi
      - name: Ad-hoc sign
        run: codesign --force --deep --sign - "dist/Token接入器.app"
      - name: Create DMG
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          hdiutil create -volname "Token接入器" -srcfolder "dist/Token接入器.app" -ov -format UDZO "Token接入器_M_v${VERSION}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Mac-M芯片-Token接入器_v${{ steps.ver.outputs.version }}
          path: Token接入器_M_v${{ steps.ver.outputs.version }}.dmg

  build-mac-intel:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Install x86_64 Python from python.org
        run: |
          curl -L -o /tmp/python_x86.pkg "https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg"
          sudo installer -pkg /tmp/python_x86.pkg -target /
          arch -x86_64 /Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11 -c 'import struct,platform; print("arch", platform.machine(), "ptr", struct.calcsize("P"))'
      - name: Install deps (x86_64)
        run: |
          arch -x86_64 /Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11 -m pip install PySide6 requests pyinstaller -i https://pypi.tuna.tsinghua.edu.cn/simple
      - name: Build .app (x86_64)
        run: |
          arch -x86_64 /Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11 -m PyInstaller --windowed --noconfirm --name "Token接入器-Intel" --add-data "src:src" --add-data "assets:assets" --collect-submodules src.ui --collect-submodules src.modules --collect-submodules src.utils --collect-submodules src.i18n --collect-submodules src.models src/_entry.py
      - name: Verify binary is x86_64
        run: |
          BINARY="dist/Token接入器-Intel.app/Contents/MacOS/Token接入器-Intel"
          if [ -f "$BINARY" ]; then
            ARCH=$(python3 -c 'import struct
          f=open("'"$BINARY"'","rb")
          d=f.read(12)
          ct=struct.unpack("<I",d[4:8])[0]
          print("x86_64" if ct==0x01000007 else "arm64" if ct==0x0100000c else "unknown")')
            echo "Binary architecture: $ARCH"
            if [ "$ARCH" != "x86_64" ]; then
              echo "ERROR: Binary is NOT x86_64!"
              exit 1
            fi
            echo "Confirmed x86_64"
          else
            echo "Binary not found, searching..."
            find dist -name "*.app" -exec ls -la {}/Contents/MacOS/ \;
            exit 1
          fi
      - name: Smoke test (launch 8s via Rosetta)
        run: |
          codesign --force --deep --sign - "dist/Token接入器-Intel.app"
          open "dist/Token接入器-Intel.app"
          sleep 8
          if pgrep -f "Token接入器-Intel" > /dev/null; then
            echo "App is running (x86_64 via Rosetta on M runner)"
            pkill -f "Token接入器-Intel" || true
          else
            echo "App failed to launch!"
            ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | tail -5
            exit 1
          fi
      - name: Create DMG
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          hdiutil create -volname "Token接入器-Intel" -srcfolder "dist/Token接入器-Intel.app" -ov -format UDZO "Token接入器_Intel_v${VERSION}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Mac-英特尔-Token接入器_v${{ steps.ver.outputs.version }}
          path: Token接入器_Intel_v${{ steps.ver.outputs.version }}.dmg
